edition = "2023";

import "google/protobuf/timestamp.proto";

package statsgate;

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

enum Race {
  RACE_UNSPECIFIED = 0;
  RACE_ISDF = 1;
  RACE_SCION = 2;
  RACE_HADEAN = 3;
}

// Arbitary IDs are intentional to avoid conflicting with the win32 api, this shouldn't
// affect data processing
enum Outcome {
  OUTCOME_UNSPECIFIED = 0; // This shouldn't appear, it indicates corruption of some kind or invalid data
  OUTCOME_TEAM1_WIN = 1000;
  OUTCOME_TEAM2_WIN = 1001;
  OUTCOME_DRAW = 1002;
  OUTCOME_GAME_CANCELLED = 1003; // Game ended abnormally due to early RE, game crashing, restart, etc.
}

// Steam64 ID should be used for identifying unique players in processing. Nickname
// is cosmetic and may change during the game. Some players might have frequently changing nicknames.
message PlayerInfo {
  uint64 steam64 = 1;
  uint32 teamnum = 2;
  string nickname = 3; // the nickname they had when first recorded
}

// Important notes:

// Anything with a `team` refers to the team slot
// from 1-10, NOT the teamplay team.
// Team 1 is teams 1-5, Team 2 is teams 6-10

message StatHeader {
  string map = 1;
  google.protobuf.Timestamp start_time = 2;
  string author_nickname = 3;
  uint64 author_steam64 = 4;
  uint32 tick_rate = 5;
  reserved 6;
  reserved 7;
  string active_config_mod = 8;
  reserved 9;
  reserved 10;

  uint32 last_tick = 11;

  float terrain_min_x = 12;
  float terrain_max_x = 13;
  float terrain_min_y = 14;
  float terrain_max_y = 15;
  float terrain_min_z = 16;
  float terrain_max_z = 17;

  // this is true if the stat session was cancelled via mission script
  // or console command, otherwise false if the game ended normally
  bool shutdown_requested = 18;

  Race team1_race = 19;
  Race team2_race = 20;

  Outcome game_outcome = 21;

  repeated PlayerInfo players = 22;
}

// As of now these events only track player shots

message BulletInit {
  uint32 tick = 1;
  uint64 shooter = 2;
  string ordnance_odf = 3;
}

// Either shooter or victim must be a player for this event to be recorded right now,
// but if there is interest in AI vs AI hits we can implement that
message BulletHit {
  uint32 tick = 1;
  uint64 shooter = 2; // undefined if not a player
  string ordnance_odf = 3;
  uint64 victim = 4; // undefined if not a player
  string victim_odf = 5;
  string shooter_odf = 6;
  float distance_to_target = 7;
}

// Note on damage messages: shooter/victim are the steam64 id of the player if applicable,
// otherwise the field is undefined. Team is the team slot that the message is associated with
// (may not be a player, could be an ai or structure). If a player owns AI or structures
// they will have the same team slot as the player.

message DamageDealt {
  uint32 tick = 1;

  uint64 shooter = 2; // undefined if not a player
  int32 shooter_team = 3;
  string shooter_odf = 4;

  uint64 victim = 5; // undefined if not a player
  int32 victim_team = 6;
  string victim_odf = 7;

  string ordnance_odf = 8; // undefined for environmental damage (water, other unknown sources)
  float amount = 9;
}

message PlayerState {
  uint64 player = 1;
  Vec3 position = 2;
  float speed = 3;
  float health = 4; // Actual hp values not ratio
  float ammo = 5;   // Same as health
  string odf = 6;
  bool has_target = 7; // are they using the T key?
}

enum ScrapStatus {
  SCRAP_STATUS_UNSPECIFIED = 0;
  SCRAP_STATUS_GREEN = 1;
  SCRAP_STATUS_YELLOW = 2;
  SCRAP_STATUS_RED = 3;
  SCRAP_STATUS_PARALLEL = 4; // currently unused for mods with parallel scrap pools
}

message ResourceState {
  uint32 current_scrap = 1;
  uint32 max_scrap = 2;
  ScrapStatus scrap_status = 3;
  uint32 pool_count = 4; // total pool count including upgrades
  uint32 upgrade_count = 5; // only upgrades
}

message UpdateTick {
  uint32 tick = 1;
  repeated PlayerState players = 2;
  ResourceState team1_resources = 3;
  ResourceState team2_resources = 4;
}

message UnitDestroyed {
  uint32 tick = 1;

  uint64 killer = 2; // undefined if killer was not a player
  uint32 killer_team = 3;
  string killer_odf = 4;

  uint64 victim = 5; // undefined if victim was not a player
  uint32 victim_team = 6;
  string victim_odf = 7;
}

// Shooter and undefined if they are not players, this is probably rare but it might occur in mods that use
// sniping ai, or projectiles that are sniper shells with travel time (shooter might be dead)
message UnitSniped {
  uint32 tick = 1;

  uint64 shooter = 2;
  uint32 shooter_team = 3;
  string shooter_odf = 4;

  uint64 victim = 5;
  uint32 victim_team = 6;
  string victim_odf = 7;
}

// This detects pod and crate pickups
message PickupPowerup {
  uint32 tick = 1;

  uint64 picker = 2; // if an AI picks up the powerup this is undefined
  uint32 picker_team = 3;
  string picker_odf = 4;

  uint32 powerup_team = 5; // the team that owns the powerup
  string powerup_odf = 6;
}

enum BuildEventType {
  BUILD_EVENT_TYPE_UNSPECIFIED = 0;
  BUILD_EVENT_TYPE_QUEUE = 1;
  BUILD_EVENT_TYPE_CANCEL = 2;
  BUILD_EVENT_TYPE_BUILD = 3;
}

enum ProducerType {
  PRODUCER_TYPE_UNSPECIFIED = 0;
  PRODUCER_TYPE_FACTORY = 1;
  PRODUCER_TYPE_CONSTRUCTOR = 2;
  PRODUCER_TYPE_ARMORY = 3;
}

message BuildEvent {
  uint32 tick = 1;
  BuildEventType type = 2;
  ProducerType producer = 3;
  uint32 teamnum = 4;
  string build_odf = 5;
}

message StatEvent {
  reserved 4;
  oneof event_type {
    BulletInit bullet_init = 1;
    BulletHit bullet_hit = 2;
    DamageDealt damage_dealt = 3;
    UpdateTick update_tick = 5;
    UnitDestroyed unit_destroyed = 6;
    UnitSniped unit_sniped = 7;
    PickupPowerup pickup_powerup = 8;
    BuildEvent build_event = 9;
  }
}

message ClientStatSession {
  StatHeader header = 1;
  repeated StatEvent event_stream = 2;
}
