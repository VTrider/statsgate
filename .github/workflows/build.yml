name: Build Binaries

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get CMake and Ninja
      uses: lukka/get-cmake@latest

    - name: Cache vcpkg binaries
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/vcpkg_installed
        key: ${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: 'b8922ae57c61d4192a504bbb955d19599fa68f2a'

    - name: Setup x86 Dev Tools
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Build
      run: |
        cmake --preset x86-release
        cmake --build --preset x86-release

    - name: Generate Short SHA
      shell: pwsh
      run: |
        $shortSha = $env:GITHUB_SHA.Substring(0, 7)
        echo "SHORT_SHA=$shortSha" >> $env:GITHUB_ENV

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: statsgate-nightly-${{ env.SHORT_SHA }}
        path: |
          build/x86-release/bin/*.exe
          build/x86-release/bin/*.dll
